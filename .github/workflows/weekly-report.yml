name: Weekly report

on:
  schedule:
    - cron: "0 6 * * 0"   # every Sunday 06:00 UTC (8-9 AM Cairo)
  workflow_dispatch:
    inputs:
      client:
        description: "Client id (leave empty for all clients)"
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate reports
        id: run
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY in Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -n "$GOOGLE_ADS_DEVELOPER_TOKEN" ]; then pip install google-ads; fi
          python weekly_report.py ${{ github.event.inputs.client }}

      - name: Save reports to the repo
        run: |
          git config user.name "weekly-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/
          if git diff --cached --quiet; then
            echo "No new reports."
          else
            git commit -m "Weekly reports $(date +%F)"
            git push
          fi

      - name: Fail if any client failed
        if: steps.run.outcome == 'failure'
        run: exit 1
