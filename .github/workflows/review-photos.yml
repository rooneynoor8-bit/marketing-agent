name: Review photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.AHMED1993 }}
        run: python scripts/review_photos.py data/lamsa-naema_photos.json reports/lamsa-naema/photos-review.md
      - name: Save
        if: always()
        run: |
          git config user.name "agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/
          git diff --cached --quiet || (git commit -q -m "Photo review" && git pull --rebase -q origin main && git push)
